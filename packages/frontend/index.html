      <div>
        <h1>BizQuest（ビズクエスト）</h1>
        <p>
          BizQuestは、ビジネスネットワーク・コミュニティ（BNIチャプターなど）のメンバー同士が、
          カードゲームのようなゲーム要素を通じてお互いの強み・スキルを知り合い、信頼関係を深めていくための
          メンバー限定プラットフォームです。BizQuestに参加するメンバーは、1対1の面談（1on1）やお題（クエスト）
          への挑戦を通じてポイントを獲得し、ネットワーク内での交流を活性化させます。
        </p>
        <p>
          BizQuestは、メンバー同士の日程調整をスムーズにするため、Googleカレンダーとの連携機能を提供しています。
          Googleカレンダーと連携すると、BizQuestはメンバーの空き時間を自動的に確認し、1on1やミーティングの
          日程調整を効率化します。また、確定した会議にはGoogle MeetまたはZoomのオンライン会議URLが自動的に
          発行され、参加者へ共有されます。BizQuestはこれらの外部サービス連携により、メンバーが手作業でカレンダーや
          会議ツールを操作する手間を減らし、ビジネスネットワークにおける交流をより円滑にすることを目的としています。
        </p>
      </div>
