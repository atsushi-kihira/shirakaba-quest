name = "shirakaba-quest-api"
pages_build_output_dir = "dist"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "shirakaba-quest"
database_id = "abc32c5c-c253-470a-95f0-945bfc49123e"

[[kv_namespaces]]
binding = "KV"
id = "c2bf2279ae10447cbe54168b927298c8"

[[r2_buckets]]
binding = "R2"
bucket_name = "shirakaba-assets"

[vars]
ENVIRONMENT = "production"
CORS_ORIGIN = "https://shirakaba-quest.pages.dev,https://bizquest.bizolve.jp"

# Secrets は wrangler pages secret put で設定（コードに書かない）:
#   wrangler pages secret put SENDGRID_API_KEY --project-name shirakaba-quest-api
#   wrangler pages secret put SENDGRID_FROM_EMAIL --project-name shirakaba-quest-api
#   wrangler pages secret put ANTHROPIC_API_KEY --project-name shirakaba-quest-api
#   wrangler pages secret put GOOGLE_VISION_API_KEY --project-name shirakaba-quest-api
#   wrangler pages secret put SESSION_SECRET --project-name shirakaba-quest-api
#   wrangler pages secret put GOOGLE_OAUTH_CLIENT_ID --project-name shirakaba-quest-api
#   wrangler pages secret put GOOGLE_OAUTH_CLIENT_SECRET --project-name shirakaba-quest-api
#   wrangler pages secret put SCHEDULER_TOKEN_KEY --project-name shirakaba-quest-api
#   wrangler pages secret put FRONTEND_URL --project-name shirakaba-quest-api
#   wrangler pages secret put ZOOM_CLIENT_ID --project-name shirakaba-quest-api
#   wrangler pages secret put ZOOM_CLIENT_SECRET --project-name shirakaba-quest-api
